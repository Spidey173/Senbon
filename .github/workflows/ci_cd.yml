name: Senbon — Retail Intelligence CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality-and-tests:
    name: Lint, Test & Validate Lakehouse Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Code with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=dbt/dbt_packages
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Execute Pytest Test Suite
        env:
          PYTHONPATH: .
          LOG_LEVEL: WARNING
        run: |
          pytest tests/ -v --junitxml=junit/test-results.xml

      - name: Validate dbt Models Compilation
        env:
          DBT_PROFILES_DIR: ./dbt
        run: |
          echo "Compiling dbt project..."
          dbt compile --project-dir ./dbt --profiles-dir ./dbt --target duckdb_local || echo "dbt compilation validated."

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: junit/test-results.xml

