retail_data_lakehouse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'retail_admin') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'retail_secure_pass_2026') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'retail_dw') }}"
      schema: analytics
      threads: 4
      keepalives_idle: 0
    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_DOCKER_HOST', 'postgres') }}"
      user: "{{ env_var('POSTGRES_USER', 'retail_admin') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'retail_secure_pass_2026') }}"
      port: 5432
      dbname: "{{ env_var('POSTGRES_DB', 'retail_dw') }}"
      schema: analytics
      threads: 8
    duckdb_local:
      type: duckdb
      path: "{{ env_var('DUCKDB_DATABASE_PATH', 'data/retail_lakehouse.duckdb') }}"
      schema: analytics
      threads: 4

