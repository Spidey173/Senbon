version: 2

models:
  - name: dim_dates
    description: "Enterprise calendar and fiscal period dimension."
    columns:
      - name: date_key
        description: "Primary key in YYYYMMDD integer format."
        tests:
          - unique
          - not_null
      - name: calendar_date
        tests:
          - unique
          - not_null

  - name: dim_customers
    description: "Customer dimensional table."
    columns:
      - name: customer_key
        description: "Surrogate hash key."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Natural key from source system."
        tests:
          - not_null
      - name: customer_segment
        tests:
          - accepted_values:
              values: ['VIP', 'REGULAR', 'NEW', 'WHOLESALE', 'CHURNED']

  - name: dim_products
    description: "Product catalog dimension."
    columns:
      - name: product_key
        description: "Surrogate hash key."
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: dim_stores
    description: "Retail physical store locations."
    columns:
      - name: store_key
        tests:
          - unique
          - not_null
      - name: store_id
        tests:
          - unique
          - not_null

  - name: dim_employees
    description: "Retail staff dimension."
    columns:
      - name: employee_key
        tests:
          - unique
          - not_null

  - name: dim_suppliers
    description: "Vendors and global suppliers dimension."
    columns:
      - name: supplier_key
        tests:
          - unique
          - not_null

  - name: fct_orders
    description: "Header level order transactions."
    columns:
      - name: order_key
        tests:
          - unique
          - not_null
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_dates')
              field: date_key
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: store_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_stores')
              field: store_key
      - name: total_amount
        tests:
          - not_null

  - name: fct_sales
    description: "Line item sales fact table at item grain."
    columns:
      - name: sale_key
        tests:
          - unique
          - not_null
      - name: order_key
        tests:
          - not_null
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_dates')
              field: date_key
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_key
      - name: store_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_stores')
              field: store_key
      - name: quantity
        tests:
          - not_null

  - name: fct_inventory
    description: "Store daily stock snapshots."
    columns:
      - name: inventory_key
        tests:
          - unique
          - not_null
      - name: store_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_stores')
              field: store_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_key
      - name: quantity_on_hand
        tests:
          - not_null

